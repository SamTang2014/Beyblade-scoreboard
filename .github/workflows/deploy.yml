# Push 上 main 就自動 build 同部署去 GitHub Pages。
#
# 測試唔過就唔會部署 —— 寧願個網站停喺舊版本，都好過推咗個爛嘅上去，
# 因為賽事當日冇人有時間 debug。

name: 部署去 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 可以喺 GitHub 上面手動撳一下重新部署

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一個部署，唔好爭。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: 跑測試
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
